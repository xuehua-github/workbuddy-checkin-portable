name: WorkBuddy 每日签到

on:
  schedule:
    # 每天 10:30（北京时间 UTC+8 = 02:30 UTC）自动运行
    - cron: '30 2 * * *'
  # 允许在 Actions 页面手动触发，方便首次测试
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行签到
        shell: pwsh
        env:
          CONFIG_JSON: ${{ secrets.CHECKIN_CONFIG }}
        run: |
          $dir = $env:GITHUB_WORKSPACE
          Push-Location $dir
          Write-Host "当前目录: $(Get-Location)"
          Write-Host "GITHUB_WORKSPACE = $dir"

          # 1) 校验 secret 是否存在
          if (-not $env:CONFIG_JSON) {
            Write-Error "未找到 Secret 'CHECKIN_CONFIG'。请到 Settings > Secrets and variables > Actions 配置（值 = 本地 checkin_config.json 全文）。"
            exit 1
          }

          # 2) 去 BOM 并写入配置（与 exe 同目录，绝对路径）
          $raw = $env:CONFIG_JSON.TrimStart([char]0xFEFF)
          $path = Join-Path $dir 'checkin_config.json'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($path, $raw, $utf8NoBom)

          # 3) 诊断：打印 exe 真正会读到的文件内容特征
          $bytes = [System.IO.File]::ReadAllBytes($path)
          Write-Host "[诊断] checkin_config.json 路径 : $path"
          Write-Host "[诊断] 字节数                 : $($bytes.Length)"
          $head = [Math]::Min(59, [Math]::Max(0, $bytes.Length - 1))
          if ($bytes.Length -gt 0) {
            Write-Host "[诊断] 前 60 字节             : $([System.Text.Encoding]::UTF8.GetString($bytes[0..$head]))"
          } else {
            Write-Host "[诊断] 前 60 字节             : <空文件>"
          }
          try {
            $null = $raw | ConvertFrom-Json -ErrorAction Stop
            Write-Host "[诊断] JSON 校验               : OK (合法)"
          } catch {
            Write-Host "[诊断] JSON 校验               : FAIL - $($_.Exception.Message)"
            Write-Error "Secret 'CHECKIN_CONFIG' 的内容不是合法 JSON（看起来是路径或被截断）。请到 Settings > Secrets and variables > Actions 编辑它，把'值'改成'本地 checkin_config.json 的全文内容'，而不是文件路径。"
            exit 1
          }

          Write-Host "[诊断] 工作区根目录文件清单:"
          Get-ChildItem -Path $dir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

          Write-Host "[诊断] 全盘搜索其他 checkin_config.json（排除刚刚写入的）:"
          Get-ChildItem -Path $dir -Recurse -Filter checkin_config.json -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -ne $path } |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

          # 4) 运行签到
          Write-Host "===== 开始运行 WorkBuddyCheckIn.exe ====="
          & ".\WorkBuddyCheckIn.exe"
          $ec = $LASTEXITCODE
          Pop-Location
          exit $ec
