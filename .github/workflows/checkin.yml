name: WorkBuddy 每日签到

on:
  schedule:
    # 每天 10:30（北京时间 UTC+8 = 02:30 UTC）自动运行
    - cron: '30 2 * * *'
  # 允许在 Actions 页面手动触发，方便首次测试
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从 Secret 写入配置文件
        shell: pwsh
        env:
          CONFIG_JSON: ${{ secrets.CHECKIN_CONFIG }}
        run: |
          if (-not $env:CONFIG_JSON) {
            Write-Error "未找到 Secret 'CHECKIN_CONFIG'，请先在仓库 Settings > Secrets and variables > Actions 中配置（值为本地 checkin_config.json 的完整内容）。"
            exit 1
          }
          Set-Content -Path "checkin_config.json" -Value $env:CONFIG_JSON -Encoding utf8NoBom
          Write-Host "配置文件已生成（含 token，出于安全不打印内容）。"

      - name: 运行签到
        run: .\WorkBuddyCheckIn.exe
