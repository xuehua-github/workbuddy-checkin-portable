name: WorkBuddy 每日签到

on:
  schedule:
    # 每天 10:30（北京时间 UTC+8 = 02:30 UTC）自动运行
    - cron: '30 2 * * *'
  # 允许在 Actions 页面手动触发，方便首次测试
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从 Secret 写入配置文件
        shell: pwsh
        env:
          CONFIG_JSON: ${{ secrets.CHECKIN_CONFIG }}
        run: |
          if (-not $env:CONFIG_JSON) {
            Write-Error "未找到 Secret 'CHECKIN_CONFIG'，请先在仓库 Settings > Secrets and variables > Actions 中配置（值为本地 checkin_config.json 的完整内容）。"
            exit 1
          }
          $raw = $env:CONFIG_JSON
          # 去除可能存在的 UTF-8 BOM，避免 json 解析失败
          $raw = $raw.TrimStart([char]0xFEFF)
          # 写到工作区根目录（用绝对路径，避免 cwd 歧义）
          $dir = $env:GITHUB_WORKSPACE
          $path = Join-Path $dir 'checkin_config.json'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($path, $raw, $utf8NoBom)
          $info = Get-Item $path
          Write-Host "[OK] 配置文件已写入: $path"
          Write-Host "     大小:   $($info.Length) 字节"
          Write-Host "     首字节: 0x$('{0:X2}' -f [int]$raw[0])"
          Write-Host "     末字节: 0x$('{0:X2}' -f [int]$raw[-1])"
          try {
            $null = $raw | ConvertFrom-Json -ErrorAction Stop
            Write-Host "     JSON 校验: OK (合法)"
          } catch {
            Write-Host "     JSON 校验: FAIL - $($_.Exception.Message)"
            exit 1
          }

      - name: 运行签到
        shell: pwsh
        run: |
          Push-Location $env:GITHUB_WORKSPACE
          Write-Host "当前目录: $(Get-Location)"
          Write-Host "关键文件: $(Get-ChildItem -Path . -Filter checkin_config.json,WorkBuddyCheckIn.exe | Select-Object Name,Length | Format-Table -AutoSize | Out-String)"
          & ".\WorkBuddyCheckIn.exe"
          $ec = $LASTEXITCODE
          Pop-Location
          exit $ec
